name: Deploy to Fly.io

on:
  push:
    branches: [master]
  workflow_dispatch:

# Nur ein Deploy gleichzeitig; ein neuerer Push ersetzt einen wartenden
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      # Baut das Docker-Image auf den Fly-Buildern (Dockerfile + fly.toml im Repo-Root)
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
