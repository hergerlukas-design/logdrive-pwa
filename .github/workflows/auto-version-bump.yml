name: Auto Version Bump

on:
  pull_request:
    types: [closed]
    branches: [main, master]

# Bumps nacheinander ausführen, damit sich zwei Merges nicht gegenseitig überschreiben
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  version-bump:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.head.ref, 'claude/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Erhöht die Patch-Version in frontend/package.json und package-lock.json
      - name: Bump patch version
        id: bump
        working-directory: frontend
        run: |
          OLD_VERSION=$(node -p "require('./package.json').version")
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "old_version=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $OLD_VERSION → $NEW_VERSION"

      - name: Commit and push version bump
        env:
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/package.json frontend/package-lock.json
          git commit -m "chore: Version $OLD_VERSION → $NEW_VERSION" -m "Automatischer Version-Bump nach PR #$PR_NUMBER"
          # Falls master inzwischen weitergelaufen ist, vor dem Push nachziehen
          git pull --rebase origin "$BASE_REF"
          git push origin "HEAD:$BASE_REF"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          OLD_VERSION: ${{ steps.bump.outputs.old_version }}
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Version erhöht:** \`${process.env.OLD_VERSION}\` → \`${process.env.NEW_VERSION}\``,
            })
