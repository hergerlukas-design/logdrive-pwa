server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: alle Routen → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets cachen (Vite generiert inhaltsbasierte Hashes)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker nie cachen
    location ~* (sw\.js|workbox-.+\.js)$ {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml
        font/woff2;
}
